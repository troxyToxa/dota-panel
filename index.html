<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Панель Тохи</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            margin: 0;
            padding: 8px 12px;
            background-color: var(--tg-theme-bg-color, #ffffff);
            color: var(--tg-theme-text-color, #000000);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: space-around;
            align-items: center;
            height: 100vh;
            box-sizing: border-box;
            overflow: hidden;
        }
        .btn {
            background-color: var(--tg-theme-secondary-bg-color, #f0f0f0);
            border: none;
            border-radius: 12px;
            width: 60px;
            height: 44px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 22px;
            cursor: pointer;
            transition: transform 0.1s ease, background-color 0.1s ease;
        }
        .btn:active {
            transform: scale(0.92);
            background-color: var(--tg-theme-button-color, #2481cc);
        }
    </style>
</head>
<body>

    <button class="btn" id="btn1" title="Джойстик">🎮</button>
    <button class="btn" id="btn2" title="Графік">📊</button>
    <button class="btn" id="btn3" title="Кубок">🏆</button>

    <script>
        Telegram.WebApp.ready();
        Telegram.WebApp.expand();

        function sendAction(actionName) {
            // Відправляємо дані назад у бот
            Telegram.WebApp.sendData(actionName);
        }

        document.getElementById('btn1').addEventListener('click', () => sendAction('joy'));
        document.getElementById('btn2').addEventListener('click', () => sendAction('chart'));
        document.getElementById('btn3').addEventListener('click', () => sendAction('cup'));
    </script>
</body>
</html>
